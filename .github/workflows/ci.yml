name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r backend/requirements.txt opentelemetry-sdk
      - run: python -m pytest -q
      # Self-scan; exit 3 (incomplete analysis) fails the job. Policy stays report-only.
      - run: python -m avishkar scan avishkar --sarif avishkar.sarif
      - uses: actions/upload-artifact@v4
        with: {name: sarif, path: avishkar.sarif}
      - run: python -m avishkar calibrate tests/corpus > calibration-report.md
      - uses: actions/upload-artifact@v4
        with: {name: calibration-report, path: calibration-report.md}

  # Runs the WHOLE integration suite on PostgreSQL (the unit suite alone only proves SQLite).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci, POSTGRES_DB: avishkar_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AVISHKAR_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/avishkar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt "psycopg[binary]>=3.1" opentelemetry-sdk
      - run: python -m pytest tests/integration tests/unit/test_db_dialect.py -v -x -o faulthandler_timeout=90

  # Builds the worker image and runs the real Docker sandbox + Semgrep + Gitleaks end to end.
  docker-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: docker build -f infra/Dockerfile.worker -t avishkar-worker:ci .
      - run: python -m pytest tests/integration/test_docker_live.py -q -rs
        env:
          AVISHKAR_WORKER_IMAGE: avishkar-worker:ci
          AVISHKAR_DOCKER_TESTS: "1"

  # Builds the Render image and checks it boots in demo mode, seeds the samples and enforces the upload policy.
  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile.api -t avishkar-api:ci .
      - name: run in demo mode and check behaviour
        run: |
          docker run -d --name api -p 8000:8000 \
            -e AVISHKAR_DEMO_MODE=1 -e AVISHKAR_UPLOADS=admin -e AVISHKAR_PUBLISH_DEMO_LOGIN=1 \
            -e AVISHKAR_DEMO_PASSWORD=view-only-demo-ci -e AVISHKAR_ADMIN_EMAIL=owner@ci.test \
            -e AVISHKAR_ADMIN_PASSWORD=owner-password-ci -e AVISHKAR_SECRET_KEY=ci-secret-key-ci-secret-key-ci-secret \
            avishkar-api:ci
          for i in $(seq 1 40); do curl -fs localhost:8000/healthz && break; sleep 2; done
          curl -fs localhost:8000/v1/public/status | tee status.json
          python3 - <<'EOF'
          import json, urllib.request
          def call(path, data=None, headers=None):
              req = urllib.request.Request("http://localhost:8000" + path, data=data, headers=headers or {})
              return json.load(urllib.request.urlopen(req))
          st = call("/v1/public/status")
          assert st["demo"] and st["uploads"] == "admin" and st["demoLogin"]["role"] == "viewer", st
          tok = call("/v1/auth/login", json.dumps({"email": st["demoLogin"]["email"], "password": st["demoLogin"]["password"]}).encode(),
                     {"Content-Type": "application/json"})["token"]
          repos = {r["name"]: r for r in call("/v1/repositories", headers={"Authorization": "Bearer " + tok})["items"]}
          assert set(repos) == {"demo/vulnerable-python", "demo/vulnerable-javascript", "demo/secure-python", "demo/vulnerable-java"}, repos
          # each vulnerable sample is scanned as shipped, then with every fix applied, so the latest run is the fixed one
          assert repos["demo/vulnerable-python"]["latestIndex"] == 0.0 and repos["demo/vulnerable-python"]["runs"] == 2, repos
          assert repos["demo/vulnerable-javascript"]["latestIndex"] == 0.0 and repos["demo/secure-python"]["latestIndex"] == 0.0, repos
          assert repos["demo/vulnerable-java"]["latestIndex"] is None, repos  # unsupported language: incomplete, never zero
          print("seeded demo OK:", {k: v["latestIndex"] for k, v in repos.items()})
          EOF
      - name: logs on failure
        if: failure()
        run: docker logs api
