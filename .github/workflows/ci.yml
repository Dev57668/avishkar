name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # Self-scan; exit 3 (incomplete analysis) fails the job. Policy stays report-only.
      - run: python -m avishkar scan avishkar --sarif avishkar.sarif
      - uses: actions/upload-artifact@v4
        with: {name: sarif, path: avishkar.sarif}
      - run: python -m avishkar calibrate tests/corpus > calibration-report.md
      - uses: actions/upload-artifact@v4
        with: {name: calibration-report, path: calibration-report.md}

  # Runs the WHOLE integration suite on PostgreSQL (the unit suite alone only proves SQLite).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci, POSTGRES_DB: avishkar_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AVISHKAR_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/avishkar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt "psycopg[binary]>=3.1"
      - run: python -m pytest tests/integration tests/unit/test_db_dialect.py -q

  # Builds the worker image and runs the real Docker sandbox + Semgrep + Gitleaks end to end.
  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      # Pins are placeholders in the Dockerfile on purpose: set real digest/checksum before relying on this job.
      - run: |
          docker build -f infra/Dockerfile.worker -t avishkar-worker:ci \
            --build-arg GITLEAKS_SHA256="${{ vars.GITLEAKS_SHA256 }}" .
      - run: python -m pytest tests/integration/test_docker_live.py -q -rs
        env:
          AVISHKAR_WORKER_IMAGE: avishkar-worker:ci
          AVISHKAR_DOCKER_TESTS: "1"
